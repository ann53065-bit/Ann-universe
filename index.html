<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海豹星球</title>
<meta name="theme-color" content="#d9c4f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="海豹星球">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;background:#d9c4f7;color:#5a2d82;font-family:system-ui,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#d9c4f7;transition:opacity .4s}
  #splash img{width:128px;height:128px;border-radius:28px}
  #splash.hide{opacity:0;pointer-events:none}
  #fallback{display:none;margin-top:8px}
  #fallback a{color:#fff;background:#5a2d82;padding:10px 18px;border-radius:999px;text-decoration:none;font-weight:600}
  #offline{display:none;text-align:center;padding:0 24px}
</style>
</head>
<body>
<iframe id="app" title="海豹星球" allow="clipboard-write; geolocation; camera; microphone"></iframe>
<div id="splash">
  <img src="icons/icon-192.png" alt="">
  <div>海豹星球載入中…</div>
  <div id="offline">目前離線，請連上網路後重新開啟。</div>
  <div id="fallback"><a id="openDirect" target="_self">直接開啟</a></div>
</div>
<script>
const APP_URL = "https://script.google.com/macros/s/AKfycbyFn77tgo7JIl0HdMBbbQUsUMWFqYFGT6_7Ix1CNkqwpB6Ll-0nMOs_vYJ31CkE7dzp/exec";
const frame = document.getElementById('app');
const splash = document.getElementById('splash');
document.getElementById('openDirect').href = APP_URL;
if (!navigator.onLine) {
  document.getElementById('offline').style.display = 'block';
} else {
  frame.src = APP_URL;
  frame.addEventListener('load', () => splash.classList.add('hide'));
  // 若 Apps Script 不允許內嵌，10 秒後顯示「直接開啟」按鈕
  setTimeout(() => { document.getElementById('fallback').style.display = 'block'; }, 10000);
}
window.addEventListener('online', () => location.reload());
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
